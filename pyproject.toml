[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mllmsent"
version = "0.1.0"
description = "MLLMsent: multimodal LLM captioning and text-backbone sentiment classification on PerceptSent."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "accelerate==1.7.0",
    "aiohappyeyeballs==2.6.1",
    "aiohttp==3.12.12",
    "aiosignal==1.3.2",
    "async-timeout==5.0.1",
    "attrs==25.3.0",
    "bitsandbytes>=0.49.2",
    "certifi==2025.4.26",
    "charset-normalizer==3.4.2",
    "datasets==3.6.0",
    "dill==0.3.8",
    "filelock==3.18.0",
    "frozenlist==1.7.0",
    "fsspec==2025.3.0",
    "hf-xet==1.4.3",
    "huggingface-hub==1.13.0",
    "idna==3.10",
    "ipykernel>=7.2.0",
    "jinja2==3.1.6",
    "joblib==1.5.1",
    "markupsafe==3.0.2",
    "matplotlib>=3.10.8",
    "mpmath==1.3.0",
    "multidict==6.4.4",
    "multiprocess==0.70.16",
    "nbconvert>=7.17.1",
    "networkx==3.4.2",
    "numpy==2.2.6",
    "nvidia-cublas-cu12==12.1.3.1",
    "nvidia-cuda-cupti-cu12==12.1.105",
    "nvidia-cuda-nvrtc-cu12==12.1.105",
    "nvidia-cuda-runtime-cu12==12.1.105",
    "nvidia-cudnn-cu12==9.1.0.70",
    "nvidia-cufft-cu12==11.0.2.54",
    "nvidia-cufile-cu12==1.11.1.6",
    "nvidia-curand-cu12==10.3.2.106",
    "nvidia-cusolver-cu12==11.4.5.107",
    "nvidia-cusparse-cu12==12.1.0.106",
    "nvidia-cusparselt-cu12==0.6.3",
    "nvidia-nccl-cu12==2.21.5",
    "nvidia-nvjitlink-cu12==12.6.85",
    "nvidia-nvtx-cu12==12.1.105",
    "packaging==25.0",
    "pandas==2.3.0",
    "peft==0.15.2",
    "pillow==11.2.1",
    "propcache==0.3.2",
    "psutil==7.0.0",
    "pyarrow==20.0.0",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    "pyyaml==6.0.2",
    "regex==2026.4.4",
    "requests==2.32.4",
    "safetensors==0.5.3",
    "scikit-learn==1.7.0",
    "scipy==1.15.3",
    "six==1.17.0",
    "sympy==1.13.1",
    "threadpoolctl==3.6.0",
    "tokenizers==0.22.2",
    "torch==2.5.1+cu121",
    "torchvision==0.20.1+cu121",
    "tqdm==4.67.1",
    "transformers==5.7.0",
    "triton==3.1.0",
    "trl==0.18.1",
    "typing-extensions==4.14.0",
    "tzdata==2025.2",
    "urllib3>=2.6.3",
    "xxhash==3.5.0",
    "yarl==1.20.1",
    "openai==1.99.1",
    "google-genai==1.28.0",
    "python-dotenv==1.1.1",
]

[project.optional-dependencies]
# VADER baseline only; deepseek-vl2 is not on PyPI:
#   pip install git+https://github.com/deepseek-ai/DeepSeek-VL2.git
baselines = ["nltk>=3.9", "vaderSentiment>=3.3"]

[project.scripts]
mllmsent = "mllmsent.cli:main"

[project.urls]
Homepage = "https://github.com/neemiasbsilva/multimodal-LLMs-See-Sentiment"
Models = "https://huggingface.co/Neemias/multimodal-LLMs-See-Sentiment"
Dataset = "https://huggingface.co/datasets/Neemias/multimodal-LLMs-See-Sentiment"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mllmsent*"]

[tool.setuptools.package-data]
mllmsent = ["py.typed"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
