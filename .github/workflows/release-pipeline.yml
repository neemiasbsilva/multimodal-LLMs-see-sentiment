name: Release Pipeline

# Build the project Docker image and publish it to the GitHub Container
# Registry (GHCR) whenever a new GitHub Release is published. 
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"

      # Fast fail-early check that uv.lock is in sync with pyproject.toml. The
      # actual environment is provisioned by `uv sync` inside the Docker build.
      - name: Validate lockfile
        run: uv lock --check

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives image tags/labels from the release. github.event.release.tag_name
      # carries the semantic version (e.g. v1.0.0); `type=raw,value=latest`
      # additionally tags the newest release as latest. The image name is the
      # lowercased repository path under ghcr.io.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
